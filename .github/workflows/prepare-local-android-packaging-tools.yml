name: Prepare Android packaging tools for private APK build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/prepare-local-android-packaging-tools.yml'

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install packaging components
        run: |
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0' >/dev/null

      - name: Assemble compact packaging SDK
        run: |
          mkdir -p android-packaging-sdk/build-tools android-packaging-sdk/platforms/android-35
          cp -a "$ANDROID_HOME/build-tools/35.0.0" android-packaging-sdk/build-tools/
          cp "$ANDROID_HOME/platforms/android-35/android.jar" android-packaging-sdk/platforms/android-35/
          printf 'sdk.dir=%s\n' "$ANDROID_HOME" > android-packaging-sdk/source-sdk.txt
          tar --zstd -cf android-packaging-sdk.tar.zst android-packaging-sdk
          ls -lh android-packaging-sdk.tar.zst
          sha256sum android-packaging-sdk.tar.zst > android-packaging-sdk.tar.zst.sha256
          cat android-packaging-sdk.tar.zst.sha256

      - name: Upload packaging SDK
        uses: actions/upload-artifact@v4
        with:
          name: android-packaging-sdk-35
          path: |
            android-packaging-sdk.tar.zst
            android-packaging-sdk.tar.zst.sha256
          retention-days: 7
          compression-level: 0
