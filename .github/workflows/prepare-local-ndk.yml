name: Prepare Android NDK r29 for private local build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/prepare-local-ndk.yml'

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK r29
        run: sdkmanager 'ndk;29.0.14206865' >/dev/null

      - name: Archive NDK
        run: |
          tar --zstd -cf android-ndk-r29-linux.tar.zst \
            -C "$ANDROID_HOME/ndk" 29.0.14206865
          ls -lh android-ndk-r29-linux.tar.zst
          sha256sum android-ndk-r29-linux.tar.zst > android-ndk-r29-linux.tar.zst.sha256
          cat android-ndk-r29-linux.tar.zst.sha256

      - name: Upload NDK bundle
        uses: actions/upload-artifact@v4
        with:
          name: android-ndk-r29-linux
          path: |
            android-ndk-r29-linux.tar.zst
            android-ndk-r29-linux.tar.zst.sha256
          retention-days: 7
          compression-level: 0
