name: Validate Android source transforms

on:
  push:
    branches: [main, android-port]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout port repository
        uses: actions/checkout@v4

      - name: Fetch upstream re:Blue
        run: git clone --depth 1 https://github.com/zolaware/reblue.git upstream/reblue

      - name: Fetch upstream ReXGlue SDK
        run: git clone --depth 1 https://github.com/rexglue/rexglue-sdk.git upstream/rexglue-sdk

      - name: Apply Android source transforms
        run: python3 scripts/apply_android_port_v11.py

      - name: Validate transformed trees
        run: |
          git -C upstream/reblue diff --check
          git -C upstream/rexglue-sdk diff --check
          grep -q 'OUTPUT_NAME main' upstream/reblue/CMakeLists.txt
          grep -q 'defined(__ANDROID__)' upstream/reblue/src/platform/native_window.cpp
          grep -q 'REBLUE_PREGENERATED' upstream/reblue/generated/rexglue.cmake
          grep -q 'Using pre-generated re:Blue recompilation sources' upstream/reblue/generated/rexglue.cmake
          grep -q 'android-arm64' upstream/rexglue-sdk/CMakeLists.txt
          grep -q 'enable_language(ASM)' upstream/rexglue-sdk/CMakeLists.txt
          grep -q 'SDL_PROP_WINDOW_ANDROID_WINDOW_POINTER' upstream/rexglue-sdk/src/ui/window_sdl.cpp
          grep -q 'defined(__APPLE__) || defined(__ANDROID__)' upstream/rexglue-sdk/include/rex/chrono/chrono.h
          grep -q 'AndroidContext' upstream/rexglue-sdk/include/rex/thread/fiber.h
          grep -q 'android_get_device_api_level' upstream/rexglue-sdk/include/rex/main_android.h
          grep -q '#include <rex/main_android.h>' upstream/rexglue-sdk/src/core/memory_posix.cpp
          test "$(grep -c 'REX_PLATFORM_LINUX && !REX_PLATFORM_ANDROID' upstream/rexglue-sdk/src/core/threading_posix.cpp)" -ge 3
          grep -A2 'elseif(ANDROID)' upstream/rexglue-sdk/src/core/CMakeLists.txt | grep -q 'target_link_libraries(rexcore PRIVATE dl SDL3::SDL3)'
          grep -q 'filesystem_android.cpp' upstream/rexglue-sdk/src/core/CMakeLists.txt
          grep -q 'SDL_GetAndroidJNIEnv' upstream/rexglue-sdk/src/core/filesystem_android.cpp
          grep -q 'SDL_GetAndroidActivity' upstream/rexglue-sdk/src/core/filesystem_android.cpp
          grep -q 'OpenAndroidContentFileDescriptor' upstream/rexglue-sdk/src/core/filesystem_android.cpp
          test -f upstream/rexglue-sdk/include/rex/ui/surface_android.h
          test -f upstream/rexglue-sdk/src/ui/surface_android.cpp
          test -f upstream/rexglue-sdk/src/core/fiber_android.cpp
          test -f upstream/rexglue-sdk/src/core/fiber_android_arm64.S
          test -f upstream/rexglue-sdk/src/core/filesystem_android.cpp

      - name: Summary
        run: |
          echo '### Android port source validation' >> "$GITHUB_STEP_SUMMARY"
          echo '- re:Blue transforms: OK' >> "$GITHUB_STEP_SUMMARY"
          echo '- ReXGlue transforms: OK' >> "$GITHUB_STEP_SUMMARY"
          echo '- SDL3 → ANativeWindow bridge: present' >> "$GITHUB_STEP_SUMMARY"
          echo '- Android ARM64 platform selection: present' >> "$GITHUB_STEP_SUMMARY"
          echo '- Android libc++ chrono compatibility: present' >> "$GITHUB_STEP_SUMMARY"
          echo '- Native AArch64 fiber backend: present' >> "$GITHUB_STEP_SUMMARY"
          echo '- ASM enabled at project root: present' >> "$GITHUB_STEP_SUMMARY"
          echo '- Android API-level bridge: present' >> "$GITHUB_STEP_SUMMARY"
          echo '- Bionic robust-mutex fallback: present' >> "$GITHUB_STEP_SUMMARY"
          echo '- Android pthread/rt libc linkage: present' >> "$GITHUB_STEP_SUMMARY"
          echo '- SDL3 Android content URI bridge: present' >> "$GITHUB_STEP_SUMMARY"
          echo '- SDL3 Android rexcore dependency: present' >> "$GITHUB_STEP_SUMMARY"
          echo '- Pre-generated re:Blue cross-build mode: present' >> "$GITHUB_STEP_SUMMARY"
