name: Validate Android source transforms

on:
  push:
    branches: [main, android-port]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout port repository
        uses: actions/checkout@v4

      - name: Fetch upstream re:Blue
        run: git clone --depth 1 https://github.com/zolaware/reblue.git upstream/reblue

      - name: Fetch upstream ReXGlue SDK
        run: git clone --depth 1 https://github.com/rexglue/rexglue-sdk.git upstream/rexglue-sdk

      - name: Apply Android source transforms
        run: python3 scripts/apply_android_port.py

      - name: Validate transformed trees
        run: |
          git -C upstream/reblue diff --check
          git -C upstream/rexglue-sdk diff --check
          grep -q 'OUTPUT_NAME main' upstream/reblue/CMakeLists.txt
          grep -q 'defined(__ANDROID__)' upstream/reblue/src/platform/native_window.cpp
          grep -q 'android-arm64' upstream/rexglue-sdk/CMakeLists.txt
          grep -q 'SDL_PROP_WINDOW_ANDROID_WINDOW_POINTER' upstream/rexglue-sdk/src/ui/window_sdl.cpp
          test -f upstream/rexglue-sdk/include/rex/ui/surface_android.h
          test -f upstream/rexglue-sdk/src/ui/surface_android.cpp

      - name: Summary
        run: |
          echo '### Android port source validation' >> "$GITHUB_STEP_SUMMARY"
          echo '- re:Blue transforms: OK' >> "$GITHUB_STEP_SUMMARY"
          echo '- ReXGlue transforms: OK' >> "$GITHUB_STEP_SUMMARY"
          echo '- SDL3 → ANativeWindow bridge: present' >> "$GITHUB_STEP_SUMMARY"
          echo '- Android ARM64 platform selection: present' >> "$GITHUB_STEP_SUMMARY"
